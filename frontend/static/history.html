<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ITDB — История</title>

  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/history.css">
</head>

<body>
  <div id="app">
    <nav class="top-menu">
      <span class="brand">ITDB</span>
      <a href="/">Таблица</a>
      <a href="/tree.html">Дерево</a>
      <a href="/history.html" class="active">История</a>
    </nav>

    <div class="page">
      <div v-if="loading">Загрузка...</div>
      <div v-else-if="error" style="color: #a00;">{{ error }}</div>
      <div v-else-if="items.length === 0">История пока пуста.</div>

      <table v-else class="history-table">
        <thead>
          <tr>
            <th>Когда</th>
            <th>Объект</th>
            <th>Пользователь</th>
            <th>Изменения</th>
          </tr>
        </thead>

        <tbody>
          <tr v-for="item in items" :key="item.id">
            <td class="nowrap">{{ formatTime(item.at) }}</td>

            <td class="nowrap">
              <template v-if="item.title">{{ item.title }}</template>
              <template v-else>{{ item.entity }} #{{ item.entity_id }}</template>
            </td>

            <td class="nowrap">
              <template v-if="item.user_name">{{ item.user_name }}</template>
              <template v-else>—</template>
            </td>

            <td>
              <div
                v-for="(change, field) in item.changes"
                :key="field"
                class="change"
              >
                <span class="field">{{ field }}:</span>
                <span class="old">{{ display(change.old) }}</span>
                <span class="arrow">→</span>
                <span class="new">{{ display(change.new) }}</span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/history.js"></script>
</body>
</html>
