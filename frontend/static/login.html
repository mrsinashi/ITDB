<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ITDB — Вход</title>

  <link rel="stylesheet" href="/app.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("itdb.theme") || "red"; } catch (e) {}</script>
</head>

<body class="login-page">
  <div class="login-wrap">
    <form id="loginForm" class="login-box">
      <div class="login-head">ITDB<span>учёт компьютеров</span></div>

      <div class="login-fields">
        <div id="error" class="error"></div>

        <input
          id="login"
          class="input"
          placeholder="Логин"
          autocomplete="username"
          autofocus
        >

        <input
          id="password"
          class="input"
          type="password"
          placeholder="Пароль"
          autocomplete="current-password"
        >

        <button type="submit" class="btn btn-primary">Войти</button>
      </div>
    </form>
  </div>

  <script src="/login.js"></script>
</body>
</html>
