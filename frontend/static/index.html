<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ITDB</title>

  <link rel="stylesheet" href="/vendor/ag-grid.css">
  <link rel="stylesheet" href="/vendor/ag-theme-alpine.css">

  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      font-size: 13px;
    }

    #app {
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 4px 8px;
      border-bottom: 1px solid #ccc;
    }

    .toolbar input {
      width: 360px;
      padding: 2px 6px;
      font-size: 13px;
    }

    #grid {
      flex: 1;
      width: 100%;
    }

    .ag-cell {
      padding-top: 1px;
      padding-bottom: 1px;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="toolbar">
      <input
        v-model="quickFilter"
        @input="applyQuickFilter"
        placeholder="Поиск по всей таблице"
      >

      <span v-if="loading">Загрузка...</span>
      <span v-else-if="error" style="color: #a00;">{{ error }}</span>
      <span v-else>{{ rowCount }} записей</span>
    </div>

    <div id="grid" class="ag-theme-alpine"></div>
  </div>

  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/vendor/ag-grid-community.min.js"></script>

  <script>
    const columnDefs = [
      { field: "location_path", headerName: "Расположение", width: 290 },
      { field: "seat_no", headerName: "Место", width: 70, cellStyle: { textAlign: "center" } },
      { field: "hostname", headerName: "Hostname", width: 150 },
      { field: "ip", headerName: "IP", width: 130, autoHeight: true, cellStyle: { whiteSpace: "pre-line" } },
      { field: "mac", headerName: "MAC", width: 165, autoHeight: true, cellStyle: { whiteSpace: "pre-line" } },
      { field: "user", headerName: "Пользователь", width: 190 },
      { field: "vacuum", headerName: "VACUUM", width: 140, autoHeight: true, cellStyle: { whiteSpace: "pre-line" } },
      { field: "status", headerName: "Статус", width: 100 },
      { field: "type", headerName: "Тип", width: 100 },
      { field: "model", headerName: "Модель", width: 140 },
      { field: "os", headerName: "ОС", width: 120 },
      { field: "cpu", headerName: "CPU", width: 170 },
      { field: "ram", headerName: "RAM", width: 70, cellStyle: { textAlign: "center" } },
      { field: "drive", headerName: "Диск", width: 130, autoHeight: true, cellStyle: { whiteSpace: "pre-line" } },
      { field: "gpu", headerName: "GPU", width: 140 },
      { field: "inv_no", headerName: "Инв.", width: 90 },
      { field: "gsit", headerName: "GSIT", width: 80 },
      { field: "state", headerName: "Сост.", width: 80 },
      { field: "label", headerName: "Метка", width: 90 },
      { field: "note", headerName: "Примечание", width: 230 }
    ];

    const gridOptions = {
      columnDefs: columnDefs,
      defaultColDef: {
        sortable: true,
        filter: true,
        resizable: true
      },
      rowData: [],
      rowHeight: 26,
      headerHeight: 28,
      animateRows: false
    };

    const app = Vue.createApp({
      data() {
        return {
          loading: true,
          error: "",
          rowCount: 0,
          quickFilter: "",
          gridApi: null
        };
      },

      async mounted() {
        const gridDiv = document.getElementById("grid");

        if (agGrid.createGrid) {
          this.gridApi = agGrid.createGrid(gridDiv, gridOptions);
        } else {
          new agGrid.Grid(gridDiv, gridOptions);
          this.gridApi = gridOptions.api;
        }

        try {
          const response = await fetch("/api/computers");

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          const data = await response.json();

          this.setRowData(data.rows || []);
          this.rowCount = data.total || 0;
        } catch (e) {
          this.error = String(e);
        }

        this.loading = false;
      },

      methods: {
        setRowData(rows) {
          if (!this.gridApi) {
            return;
          }

          if (this.gridApi.setGridOption) {
            this.gridApi.setGridOption("rowData", rows);
          } else {
            this.gridApi.setRowData(rows);
          }
        },

        applyQuickFilter() {
          if (!this.gridApi) {
            return;
          }

          if (this.gridApi.setGridOption) {
            this.gridApi.setGridOption("quickFilterText", this.quickFilter);
          } else {
            this.gridApi.setQuickFilterText(this.quickFilter);
          }
        }
      }
    });

    app.mount("#app");

    window.addEventListener("keydown", function (event) {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "f") {
        event.preventDefault();

        const input = document.querySelector(".toolbar input");

        if (input) {
          input.focus();
          input.select();
        }
      }
    });
  </script>
</body>
</html>
