<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ITDB — Таблица</title>

  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/vendor/ag-grid.css">
  <link rel="stylesheet" href="/vendor/ag-theme-alpine.css">
  <link rel="stylesheet" href="/app.css">
</head>

<body>
  <div id="app">
    <nav class="top-menu">
        <span class="brand">ITDB</span>
        <a href="/" class="active">Таблица</a>
        <a href="/tree.html">Дерево</a>
        <a href="/history.html">История</a>
        <a href="/api/export/computers.xlsx">Экспорт</a>
    </nav>

    <div class="toolbar">
      <input
        id="quickFilter"
        v-model="quickFilter"
        @input="applyQuickFilter"
        placeholder="Поиск по всей таблице"
      >

      <span v-if="loading">Загрузка...</span>
      <span v-else-if="error" style="color: #a00;">{{ error }}</span>
      <span v-else>{{ rowCount }} записей</span>
    </div>

    <div id="grid" class="ag-theme-alpine grid"></div>
  </div>

  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/vendor/ag-grid-community.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
