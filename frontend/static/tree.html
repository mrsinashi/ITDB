<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ITDB — Дерево</title>

  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/tree.css">
</head>

<body>
  <div id="app">
    <nav class="top-menu">
      <span class="brand">ITDB</span>
      <a href="/">Таблица</a>
      <a href="/tree.html" class="active">Дерево</a>
      <a href="/history.html">История</a>
    </nav>

    <div class="info-bar">
      <span v-if="loading">Загрузка...</span>
      <span v-else-if="error" style="color: #a00;">{{ error }}</span>
      <span v-else>Без расположения: {{ unlocated }}</span>
    </div>

    <div class="tree" v-if="!loading && !error">
      <div v-if="roots.length === 0">
        Расположения не найдены.
      </div>

      <tree-node
        v-for="root in roots"
        :key="root.id"
        :node="root"
        :level="0"
      ></tree-node>
    </div>
  </div>

  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/tree.js"></script>
</body>
</html>
